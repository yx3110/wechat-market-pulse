name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,media]"
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: Validate Windows installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install-windows.ps1
      - name: Validate macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/install-macos.sh
      - run: python -m build
      - name: Install wheel into a clean environment and verify bundled assets
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile, venv
          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              venv.create(root / 'env', with_pip=True)
              python = root / 'env' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
              result = subprocess.run([str(python), '-m', 'marketpulse', '--home', str(root/'runtime'), '--json', 'demo'], cwd=root, capture_output=True, encoding='utf-8', check=True)
              data = json.loads(result.stdout)
              assert data['ok'] and pathlib.Path(data['data']['image']).is_file()
